[package]
name = "telegraph-rs"
version = "0.8.0-rc1"
description = "telegraph binding for Rust"
authors = ["Aloxaf <aloxafx@gmail.com>"]
homepage = "https://github.com/Aloxaf/telegraph-rs"
repository = "https://github.com/Aloxaf/telegraph-rs"
readme = "README.md"
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["html", "native-tls"]
html = ["html_parser"]

native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "multipart",
    "query",
    "form",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
html_parser = { version = "0.7.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "test-util"] }
